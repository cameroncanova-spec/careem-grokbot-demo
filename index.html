<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex, nofollow">
        <meta name="theme-color" content="#05060a">
        <title>Grok Bot demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #000000;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #000000;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #000000;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
html,body{background:#000!important;color:#fff;margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.staticrypt-body{background:#000!important;overflow:hidden}
.gb-hero{position:fixed;inset:0;overflow:hidden;z-index:0;background:#000}
.gb-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:22% 50%;transform-origin:49% 45%;animation:gbkb 30s ease-in-out infinite alternate}
@keyframes gbkb{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.gb-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8) 0%,rgba(0,0,0,.45) 35%,rgba(0,0,0,0) 60%),linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 40%)}
.staticrypt-spinner-container{position:relative;z-index:1}
.gb-wrap{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-end;padding:0 7vw 12vh;box-sizing:border-box}
.gb-card{width:100%;max-width:420px;text-align:left}
.gb-kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 12px}
.gb-h1{font-size:clamp(34px,5vw,60px);font-weight:700;letter-spacing:-.025em;margin:0 0 30px;line-height:1.05;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.gb-h1 .x{color:#00e785;font-weight:300;padding:0 .12em}
.gb-form .staticrypt-password-container{position:relative;background:none!important;padding:0!important;margin:0!important}
.gb-form input[type=password],.gb-form input[type=text]{width:100%;box-sizing:border-box;background:rgba(0,0,0,.45)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)!important;border-radius:12px;color:#fff;padding:15px 46px 15px 16px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;margin:0 0 12px}
.gb-form input::placeholder{color:rgba(255,255,255,.55)}
.gb-form input[type=password]:focus,.gb-form input[type=text]:focus{border-color:#00e785!important;box-shadow:0 0 0 3px rgba(0,231,133,.2)}
.gb-form .staticrypt-toggle-password-visibility{position:absolute;right:14px;top:15px;width:20px;height:20px;filter:invert(1);opacity:.55;cursor:pointer;margin:0}
.gb-form .staticrypt-decrypt-button{width:100%;background:#fff!important;color:#000!important;border:0;border-radius:12px;padding:15px;font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;text-transform:none;transition:background .2s,transform .1s}
.gb-form .staticrypt-decrypt-button:hover{background:#00e785!important}
.gb-form .staticrypt-decrypt-button:active{transform:scale(.98)}
.gb-foot{margin-top:22px;font-size:12px;color:rgba(255,255,255,.55)}
.gb-foot b{color:#00e785;font-weight:500}
.gb-credit{position:fixed;right:14px;bottom:10px;z-index:1;font-size:10px;color:rgba(255,255,255,.4);margin:0}
@media (max-width:700px){.gb-hero img{object-position:49% 50%}.gb-hero:after{background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 45%,rgba(0,0,0,0) 75%)}.gb-wrap{padding:0 22px 9vh;justify-content:center}.gb-card{text-align:center}}
@media (prefers-reduced-motion:reduce){.gb-hero img{animation:none}}

        </style>
    </head>
